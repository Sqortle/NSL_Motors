<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<body>
    <div th:fragment="content">
        <section class="page-header">
            <div class="container">
                <h1 class="page-title">Kayıt Ol</h1>
                <p class="page-subtitle">Yeni hesap oluşturmak için bilgilerinizi giriniz</p>
            </div>
        </section>

        <section class="auth-section">
            <div class="container">
                <div class="auth-container">
                    <div class="auth-card glass-card">
                        <h2 class="auth-title">Kayıt Ol</h2>
                        
                        <!-- Hata Mesajı -->
                        <div th:if="${errorMessage}" class="alert alert-error" style="background-color: rgba(255, 0, 0, 0.1); color: #ff4444; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid rgba(255, 0, 0, 0.3);">
                            <span th:text="${errorMessage}"></span>
                        </div>

                        <!-- Başarı Mesajı -->
                        <div th:if="${successMessage}" class="alert alert-success" style="background-color: rgba(0, 255, 0, 0.1); color: #00aa00; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid rgba(0, 255, 0, 0.3);">
                            <span th:text="${successMessage}"></span>
                        </div>

                        <form class="auth-form" method="post" th:action="@{/customer/auth/register}" th:object="${registrationDto}">
                            <div class="form-group">
                                <label for="firstName">Ad</label>
                                <input 
                                    type="text" 
                                    id="firstName" 
                                    th:field="*{firstName}" 
                                    class="form-input"
                                    placeholder="Adınızı giriniz"
                                    required>
                                <div th:if="${#fields.hasErrors('firstName')}" class="error-message" style="color: #ff4444; font-size: 0.875rem; margin-top: 5px;">
                                    <span th:errors="*{firstName}"></span>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="lastName">Soyad</label>
                                <input 
                                    type="text" 
                                    id="lastName" 
                                    th:field="*{lastName}" 
                                    class="form-input"
                                    placeholder="Soyadınızı giriniz"
                                    required>
                                <div th:if="${#fields.hasErrors('lastName')}" class="error-message" style="color: #ff4444; font-size: 0.875rem; margin-top: 5px;">
                                    <span th:errors="*{lastName}"></span>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="email">Email</label>
                                <input 
                                    type="email" 
                                    id="email" 
                                    th:field="*{email}" 
                                    class="form-input"
                                    placeholder="ornek@email.com"
                                    required>
                                <div th:if="${#fields.hasErrors('email')}" class="error-message" style="color: #ff4444; font-size: 0.875rem; margin-top: 5px;">
                                    <span th:errors="*{email}"></span>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="phoneNumber">Telefon Numarası <span style="color: rgba(255, 255, 255, 0.5); font-size: 0.875rem;">(Opsiyonel)</span></label>
                                <input 
                                    type="tel" 
                                    id="phoneNumber" 
                                    th:field="*{phoneNumber}" 
                                    class="form-input"
                                    placeholder="05XX XXX XX XX">
                                <div th:if="${#fields.hasErrors('phoneNumber')}" class="error-message" style="color: #ff4444; font-size: 0.875rem; margin-top: 5px;">
                                    <span th:errors="*{phoneNumber}"></span>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="password">Şifre</label>
                                <input 
                                    type="password" 
                                    id="password" 
                                    th:field="*{password}" 
                                    class="form-input"
                                    placeholder="Minimum 8 karakter"
                                    required>
                                <div th:if="${#fields.hasErrors('password')}" class="error-message" style="color: #ff4444; font-size: 0.875rem; margin-top: 5px;">
                                    <span th:errors="*{password}"></span>
                                </div>
                                <small style="color: rgba(255, 255, 255, 0.6); font-size: 0.875rem; margin-top: 5px; display: block;">
                                    Şifre minimum 8 karakter olmalıdır
                                </small>
                            </div>

                            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">
                                Kayıt Ol
                            </button>
                        </form>

                        <div class="auth-footer" style="margin-top: 20px; text-align: center; color: rgba(255, 255, 255, 0.7);">
                            <p>Zaten hesabınız var mı? <a th:href="@{/customer/auth/login}" style="color: #00ff88;">Giriş yapın</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
