<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">

<body>
    <div th:fragment="content">
        <section class="page-header">
            <div class="container">
                <h1 class="page-title">İletişim</h1>
                <p class="page-subtitle">Bizimle iletişime geçin</p>
            </div>
        </section>

        <section class="contact-section">
            <div class="container">
                <div class="contact-grid">
                    <div class="contact-info glass-card">
                        <h2 class="contact-title">İletişim Bilgileri</h2>
                        <div class="contact-item">
                            <span class="contact-icon">📧</span>
                            <div>
                                <h4>Email</h4>
                                <p>imsbusiness00@gmail.com</p>
                            </div>
                        </div>
                        <div class="contact-item">
                            <span class="contact-icon">📞</span>
                            <div>
                                <h4>Telefon</h4>
                                <p>+90 (XXX) XXX XX XX</p>
                            </div>
                        </div>
                        <div class="contact-item">
                            <span class="contact-icon">📍</span>
                            <div>
                                <h4>Adres</h4>
                                <p>İstanbul, Türkiye</p>
                            </div>
                        </div>
                    </div>
                    <div class="contact-form-container glass-card">
                        <h2 class="contact-title">Mesaj Gönderin</h2>
                        <div th:if="${success}" class="alert alert-success"
                            style="background-color: rgba(0, 200, 0, 0.2); color: #0f5132; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid rgba(0, 200, 0, 0.3);">
                            <span th:text="${success}"></span>
                        </div>
                        <div th:if="${error}" class="alert alert-error"
                            style="background-color: rgba(255, 0, 0, 0.2); color: #842029; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid rgba(255, 0, 0, 0.3);">
                            <span th:text="${error}"></span>
                        </div>
                        <form class="contact-form" method="post" th:action="@{/contact}">
                            <div class="form-group">
                                <label for="name">Ad Soyad</label>
                                <input type="text" id="name" name="name" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" required>
                            </div>
                            <div class="form-group">
                                <label for="message">Mesaj</label>
                                <textarea id="message" name="message" rows="5" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Gönder</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>

</html>
