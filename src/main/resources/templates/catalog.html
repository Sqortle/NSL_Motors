<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<body>
    <div th:fragment="content">
        <!-- Catalog Header -->
        <section class="page-header">
            <div class="container">
                <h1 class="page-title">Araba Kataloğu</h1>
                <p class="page-subtitle">Tüm modellerimiz ve tuning paketleri</p>
            </div>
        </section>

        <!-- Catalog Content -->
        <section class="catalog-section">
            <div class="container">
                <div class="makes-grid" th:if="${makesWithImages != null and !makesWithImages.isEmpty()}">
                    <a th:each="makeEntry : ${makesWithImages}" 
                       th:href="@{/catalog/{make}(make=${makeEntry.key})}" 
                       class="make-card glass-card">
                        <div class="make-image-container" th:if="${makeEntry.value != null and !makeEntry.value.isEmpty()}">
                            <img th:src="${makeEntry.value}" th:alt="${makeEntry.key}" class="make-image">
                        </div>
                        <div class="make-image-placeholder" th:if="${makeEntry.value == null or makeEntry.value.isEmpty()}">
                            <span class="placeholder-icon">🚗</span>
                        </div>
                        <div class="make-info">
                            <h3 class="make-name" th:text="${makeEntry.key}">Marka</h3>
                        </div>
                    </a>
                </div>
                <div class="empty-state" th:if="${makesWithImages == null or makesWithImages.isEmpty()}">
                    <div class="empty-content glass-card">
                        <span class="empty-icon">🚗</span>
                        <h3 class="empty-title">Henüz marka eklenmemiş</h3>
                        <p class="empty-text">Yakında kataloğumuz güncellenecektir.</p>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
